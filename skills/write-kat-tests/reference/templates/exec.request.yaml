# Rename to: <policy-name>.<test-name>.<expect>.request.yaml
# Models a subresource CONNECT (e.g. `kubectl exec`). Because there is no object,
# the operation cannot be inferred and must be set explicitly to CONNECT.
# `resource` + `subResource` must match the policy's resourceRules (`pods/exec`);
# `options` describes the exec call. Adjust for logs/attach/etc.
operation: CONNECT
resource:
  version: v1
  resource: pods
subResource: exec
name: app-pod
namespace: production
namespaceObject:
  apiVersion: v1
  kind: Namespace
  metadata:
    name: production
    labels:
      environment: production
userInfo:
  username: user@example.com
  groups:
    - system:authenticated
options:
  container: app
  command: ["sh", "-c", "echo hello"]
  stdin: false
  stdout: true
  tty: false
