apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: variables-mapping
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
  variables:
  - name: prefixes
    expression: '["mirror.registry:5000/"]'
  - name: prefixCount
    expression: "variables.prefixes.size()"
  matchConditions:
  - name: has-prefixes
    expression: "variables.prefixCount > 0"
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: |
        Object{
          metadata: Object.metadata{
            labels: {"mirror-prefix-count": string(variables.prefixCount)}
          }
        }
