apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: count-invocations
spec:
  # IfNeeded runs the policy once more after a pass that changed the object,
  # so this non-idempotent mutation counts 2. With Never it counts 1.
  reinvocationPolicy: IfNeeded
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["configmaps"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              annotations: {
                "example.com/invocations": string(int(object.metadata.?annotations[?"example.com/invocations"].orValue("0")) + 1)
              }
            }
          }
