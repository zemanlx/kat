apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
  - name: app
    image: registry.example/app
    ports:
    - containerPort: 80
      protocol: TCP
    env:
    - name: FOO
      value: bar
    - name: INJECTED
      value: "true"
  - name: cache
    image: redis
    ports:
    - containerPort: 6379
      protocol: TCP
  - name: istio-proxy
    image: registry.example/istio-proxy
