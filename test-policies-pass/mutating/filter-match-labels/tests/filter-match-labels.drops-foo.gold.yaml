apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  labels:
    app: web
    env: prod
    foo: drop-me
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: web
              env: prod
  containers:
    - name: nginx
      image: nginx
