version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /conformance
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      kubernetes:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
