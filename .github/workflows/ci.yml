name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Weekly, to pick up new Kubernetes patch releases in the conformance job.
        - cron: "0 6 * * 1"

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"
            - name: Run Tests
              run: go test -v ./...

    conformance:
        name: Conformance (Kubernetes ${{ matrix.k8s }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Keep in sync with conformance/k8s-versions.txt.
                k8s: ["1.36.x", "1.37.x"]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"
                  cache-dependency-path: |
                      go.sum
                      conformance/go.sum

            - name: Cache envtest binaries
              uses: actions/cache@v4
              with:
                  path: bin
                  key: envtest-${{ runner.os }}-${{ matrix.k8s }}-${{ hashFiles('hack/conformance.sh') }}

            - name: Run conformance tests
              env:
                  GOTESTFLAGS: -v
              run: ./hack/conformance.sh "${{ matrix.k8s }}"

            - name: Upload generated kat suites
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: conformance-suites-${{ matrix.k8s }}
                  path: conformance/.artifacts/
                  if-no-files-found: ignore
                  include-hidden-files: true

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"

            - name: GolangCI-Lint
              uses: golangci/golangci-lint-action@v7
              with:
                  version: latest
                  install-mode: "goinstall"
                  # Skip the network schema fetch, which flakes on runners.
                  # `golangci-lint run` still validates the config at runtime.
                  verify: false

            - name: GolangCI-Lint (conformance)
              uses: golangci/golangci-lint-action@v7
              with:
                  version: latest
                  install-mode: "goinstall"
                  verify: false
                  working-directory: conformance
