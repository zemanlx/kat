name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Weekly. The conformance job's envtest cache key includes the UTC ISO
        # week, so this run fetches new Kubernetes patch releases.
        - cron: "0 6 * * 1"

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
            - name: Run Tests
              run: go test -v ./...

    k8s-versions:
        name: Kubernetes versions
        runs-on: ubuntu-latest
        outputs:
            k8s: ${{ steps.versions.outputs.k8s }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Read conformance/k8s-versions.json
              id: versions
              run: |
                  k8s="$(jq -ce 'select(type == "array" and length > 0)' conformance/k8s-versions.json)"
                  echo "k8s=${k8s}" >> "$GITHUB_OUTPUT"

    conformance:
        name: Conformance (Kubernetes ${{ matrix.k8s }})
        needs: k8s-versions
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                k8s: ${{ fromJSON(needs.k8s-versions.outputs.k8s) }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: |
                      go.sum
                      conformance/go.sum

            - name: Envtest cache week
              id: envtest-week
              run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

            - name: Cache envtest binaries
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: bin
                  key: envtest-${{ runner.os }}-${{ matrix.k8s }}-${{ steps.envtest-week.outputs.week }}-${{ hashFiles('hack/conformance.sh') }}

            - name: Run conformance tests
              env:
                  GOTESTFLAGS: -v
                  K8S_VERSION: ${{ matrix.k8s }}
              run: ./hack/conformance.sh "$K8S_VERSION"

            - name: Upload generated kat suites
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: conformance-suites-${{ matrix.k8s }}
                  path: conformance/.artifacts/
                  if-no-files-found: ignore
                  include-hidden-files: true

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: GolangCI-Lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.15.0
                  install-mode: "goinstall"
                  # Skip the network schema fetch, which flakes on runners.
                  # `golangci-lint run` still validates the config at runtime.
                  verify: false

            - name: GolangCI-Lint (conformance)
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                  version: v2.15.0
                  install-mode: "goinstall"
                  verify: false
                  working-directory: conformance
