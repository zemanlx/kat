name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Weekly. The conformance job's envtest cache key includes the UTC ISO
        # week, so this run fetches new Kubernetes patch releases.
        - cron: "0 6 * * 1"

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"
            - name: Run Tests
              run: go test -v ./...

    k8s-versions:
        name: Kubernetes versions
        runs-on: ubuntu-latest
        outputs:
            k8s: ${{ steps.versions.outputs.k8s }}
        steps:
            - uses: actions/checkout@v4

            - name: Read conformance/k8s-versions.json
              id: versions
              run: |
                  k8s="$(jq -ce 'select(type == "array" and length > 0)' conformance/k8s-versions.json)"
                  echo "k8s=${k8s}" >> "$GITHUB_OUTPUT"

    conformance:
        name: Conformance (Kubernetes ${{ matrix.k8s }})
        needs: k8s-versions
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                k8s: ${{ fromJSON(needs.k8s-versions.outputs.k8s) }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"
                  cache-dependency-path: |
                      go.sum
                      conformance/go.sum

            - name: Envtest cache week
              id: envtest-week
              run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

            - name: Cache envtest binaries
              uses: actions/cache@v4
              with:
                  path: bin
                  key: envtest-${{ runner.os }}-${{ matrix.k8s }}-${{ steps.envtest-week.outputs.week }}-${{ hashFiles('hack/conformance.sh') }}

            - name: Run conformance tests
              env:
                  GOTESTFLAGS: -v
              run: ./hack/conformance.sh "${{ matrix.k8s }}"

            - name: Upload generated kat suites
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: conformance-suites-${{ matrix.k8s }}
                  path: conformance/.artifacts/
                  if-no-files-found: ignore
                  include-hidden-files: true

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"

            - name: GolangCI-Lint
              uses: golangci/golangci-lint-action@v7
              with:
                  version: latest
                  install-mode: "goinstall"
                  # Skip the network schema fetch, which flakes on runners.
                  # `golangci-lint run` still validates the config at runtime.
                  verify: false

            - name: GolangCI-Lint (conformance)
              uses: golangci/golangci-lint-action@v7
              with:
                  version: latest
                  install-mode: "goinstall"
                  verify: false
                  working-directory: conformance
