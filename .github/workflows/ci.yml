name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"
            - name: Run Tests
              run: go test -v ./...

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"

            - name: GolangCI-Lint
              uses: golangci/golangci-lint-action@v7
              with:
                  version: latest
                  install-mode: "goinstall"
                  # Skip the network schema fetch, which flakes on runners.
                  # `golangci-lint run` still validates the config at runtime.
                  verify: false
