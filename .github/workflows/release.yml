name: Release

on:
    push:
        tags:
            - "v*"

permissions: {}

jobs:
    goreleaser:
        runs-on: ubuntu-latest
        permissions:
            contents: write # the GitHub release
            id-token: write # attestation signing
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                  distribution: goreleaser
                  version: "v2.20.2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - id: attest
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-checksums: dist/checksums.txt

            # Scorecard's Signed-Releases check looks for a release asset ending in .intoto.jsonl.
            - name: Upload build provenance to the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  BUNDLE: ${{ steps.attest.outputs.bundle-path }}
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  cp "$BUNDLE" "dist/kat_${version}.intoto.jsonl"
                  gh release upload "$GITHUB_REF_NAME" "dist/kat_${version}.intoto.jsonl" --clobber
