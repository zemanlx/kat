name: Release

on:
    push:
        tags:
            - "v*"

permissions: {}

jobs:
    goreleaser:
        runs-on: ubuntu-latest
        permissions:
            contents: write # the GitHub release
            id-token: write # attestation signing
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                  distribution: goreleaser
                  version: "v2.20.2"
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - id: attest
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-checksums: dist/checksums.txt

            # Scorecard's Signed-Releases check looks for a release asset ending in .intoto.jsonl.
            - name: Upload build provenance to the release
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  BUNDLE: ${{ steps.attest.outputs.bundle-path }}
                  TAG: ${{ github.ref_name }}
              with:
                  script: |
                      const fs = require("fs");
                      const tag = process.env.TAG;
                      const name = `kat_${tag.replace(/^v/, "")}.intoto.jsonl`;
                      const { owner, repo } = context.repo;
                      const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                      const stale = release.assets.find((asset) => asset.name === name);
                      if (stale) {
                          await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: stale.id });
                      }
                      await github.rest.repos.uploadReleaseAsset({
                          owner,
                          repo,
                          release_id: release.id,
                          name,
                          data: fs.readFileSync(process.env.BUNDLE),
                          headers: { "content-type": "application/octet-stream" },
                      });
